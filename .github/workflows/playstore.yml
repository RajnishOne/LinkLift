name: Publish to Google Play Store

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play Release Track'
        required: true
        type: choice
        options:
          - 'internal'
          - 'alpha'
          - 'beta'
          - 'production'
        default: 'internal'
      status:
        description: 'Release Status'
        required: true
        type: choice
        options:
          - 'completed'
          - 'draft'
          - 'inProgress'
          - 'halted'
        default: 'completed'
      user_fraction:
        description: 'User fraction for inProgress status (e.g. 0.1 for 10%, 1.0 for 100%)'
        required: false
        type: string
        default: '1.0'

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build Signed AAB & Publish to Google Play
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Python 3.13 (for Chaquopy build requirements)
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Decode Release Keystore & Configure Signing
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore/upload-keystore.jks
          cat <<EOF > key.properties
          storeFile=keystore/upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Release App Bundle (AAB)
        run: ./gradlew bundleRelease --no-daemon

      - name: Prepare Release Notes from Fastlane Changelog
        id: changelog
        run: |
          mkdir -p whatsnew
          for locale_dir in fastlane/metadata/android/*; do
            if [ -d "$locale_dir/changelogs" ]; then
              LOCALE=$(basename "$locale_dir")
              LATEST=$(ls -v "$locale_dir"/changelogs/*.txt 2>/dev/null | tail -n 1)
              if [ -f "$LATEST" ]; then
                echo "Copying $LATEST to whatsnew/whatsnew-$LOCALE"
                cp "$LATEST" "whatsnew/whatsnew-$LOCALE"
              fi
            fi
          done

          # Fallback if no changelog found
          if [ ! -f whatsnew/whatsnew-en-US ]; then
            echo "Bug fixes and performance improvements." > whatsnew/whatsnew-en-US
          fi

          echo "Prepared release notes:"
          ls -la whatsnew

      - name: Publish AAB to Google Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.rjnsdev.linklift.app
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track }}
          status: ${{ github.event.inputs.status }}
          userFraction: ${{ github.event.inputs.user_fraction || '1.0' }}
          whatsNewDirectory: whatsnew
          mappingFile: app/build/outputs/mapping/release/mapping.txt

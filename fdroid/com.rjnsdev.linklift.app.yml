AutoName: LinkLift
Summary: Fast, private media downloader and extractor
Description: |-

  LinkLift is a modern, privacy-focused media downloader and extractor for Android.
  It extracts, previews, and downloads video, audio, and images from YouTube, Instagram,
  TikTok, X/Twitter, Reddit, Pinterest, SoundCloud, and other supported platforms.

  Features:
  * Stream merging with native MediaMuxer for high-definition 1080p/4K downloads
  * Built-in media player with ExoPlayer/Media3
  * Batch and playlist extraction and downloads
  * System share sheet integration
  * 100% tracker-free with zero telemetry


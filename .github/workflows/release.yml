name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v2.7)'
        required: true
        default: 'v2.7'
      publish_to_playstore:
        description: 'Also publish AAB to Google Play Store'
        required: false
        type: boolean
        default: false
      play_track:
        description: 'Google Play Release Track'
        required: false
        type: choice
        options:
          - 'internal'
          - 'alpha'
          - 'beta'
          - 'production'
        default: 'internal'
      play_status:
        description: 'Google Play Release Status'
        required: false
        type: choice
        options:
          - 'completed'
          - 'draft'
          - 'inProgress'
          - 'halted'
        default: 'completed'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Signed APK & Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Python 3.13 (for Chaquopy build requirements)
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Decode Release Keystore & Configure Signing
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore/upload-keystore.jks
          cat <<EOF > key.properties
          storeFile=keystore/upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Release APK & Bundle (AAB)
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Extract Release Notes from Fastlane Changelog
        id: changelog
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="${{ github.event.inputs.tag_name }}"
          fi

          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ]; then
            TAG_NAME="${{ github.event.inputs.tag_name }}"
          fi

          if [ -z "$TAG_NAME" ]; then
            TAG_NAME="v2.7"
          fi

          # Ensure tag format starts with 'v' (e.g. 2.7 -> v2.7)
          if [[ ! "$TAG_NAME" =~ ^v ]]; then
            TAG_NAME="v$TAG_NAME"
          fi

          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

          # Find latest fastlane changelog file
          LATEST_CHANGELOG=$(ls -v fastlane/metadata/android/en-US/changelogs/*.txt 2>/dev/null | tail -n 1)
          if [ -f "$LATEST_CHANGELOG" ]; then
            echo "Found changelog: $LATEST_CHANGELOG"
            echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
            cat "$LATEST_CHANGELOG" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
            echo "Release $TAG_NAME" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release and Upload APK & AAB
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.changelog.outputs.tag_name }}
          name: LinkLift ${{ steps.changelog.outputs.tag_name }}
          body: |
            ## LinkLift ${{ steps.changelog.outputs.tag_name }}
            
            ### 📝 What's New
            ${{ steps.changelog.outputs.CHANGELOG }}
            
            ---
            *Built and signed automatically by GitHub Actions.*
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Release Notes for Google Play
        if: (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_to_playstore == 'true') || (github.event_name == 'push' && env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '')
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p whatsnew
          for locale_dir in fastlane/metadata/android/*; do
            if [ -d "$locale_dir/changelogs" ]; then
              LOCALE=$(basename "$locale_dir")
              LATEST=$(ls -v "$locale_dir"/changelogs/*.txt 2>/dev/null | tail -n 1)
              if [ -f "$LATEST" ]; then
                echo "Copying $LATEST to whatsnew/whatsnew-$LOCALE"
                cp "$LATEST" "whatsnew/whatsnew-$LOCALE"
              fi
            fi
          done

          if [ ! -f whatsnew/whatsnew-en-US ]; then
            echo "${{ steps.changelog.outputs.CHANGELOG }}" > whatsnew/whatsnew-en-US
          fi

          echo "Prepared release notes:"
          ls -la whatsnew

      - name: Publish AAB to Google Play Store
        if: (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_to_playstore == 'true') || (github.event_name == 'push' && env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '')
        uses: r0adkll/upload-google-play@v1
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.rjnsdev.linklift.app
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.play_track || 'internal' }}
          status: ${{ github.event.inputs.play_status || 'completed' }}
          userFraction: '1.0'
          whatsNewDirectory: whatsnew
          mappingFile: app/build/outputs/mapping/release/mapping.txt
